[project]
name = "aftersales-agent"
version = "1.0.0"
description = "An e-commerce after-sales & order fulfillment agent that executes write operations under hard-checked policy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aftersales = "aftersales.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aftersales", "evals"]
exclude = ["evals/reports/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: real-model smoke tests (requires credentials and network)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py311"
