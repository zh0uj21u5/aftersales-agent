name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:

jobs:
  offline-verify:
    name: Offline Tests & Policy Replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          python -m ruff check src tests evals scripts

      - name: Run offline unit and integration tests
        run: |
          python -m pytest -q

      - name: Verify task gold replay and expected amounts
        run: |
          python scripts/gen_expectations.py --check

      - name: Run offline end-to-end demo script
        run: |
          python scripts/demo.py
